services:
  doc-ai:
    image: golang:1.24-alpine
    container_name: doc-ai
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    command: sh -c "go run main.go --help"
    restart: "no"
